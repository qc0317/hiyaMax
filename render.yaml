services:
  - type: web
    name: mama-counter-sync-trial
    runtime: node
    plan: free
    region: singapore
    branch: mama-counter-render-trial
    rootDir: mama-counter-render-api
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mama-counter-trial-db
          property: connectionString
      - key: DEVICE_TOKEN
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false

databases:
  - name: mama-counter-trial-db
    databaseName: mama_counter_trial_db
    user: mama_counter_trial_db_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

